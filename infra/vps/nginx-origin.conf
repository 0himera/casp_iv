# Installed on the VPS as /etc/nginx/conf.d/caspian-origin.conf.
server {
    listen 18443 ssl;
    server_name psychaos.art;
    ssl_certificate /etc/letsencrypt/live/psychaos.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psychaos.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_http_version 1.1;
    proxy_set_header Host caspian.psychaos.art;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    location ^~ /api/v1/ { proxy_pass http://127.0.0.1:8000; }
    location = /api/v1 { proxy_pass http://127.0.0.1:8000; }
    location = /docs { proxy_pass http://127.0.0.1:8000; }
    location = /redoc { proxy_pass http://127.0.0.1:8000; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8000; }
    location / { proxy_pass http://127.0.0.1:3100; }
}
