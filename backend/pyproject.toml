[project]
name = "caspian-backend"
version = "0.1.0"
description = "Caspian Flow public data, persistent shipments and Casper testnet operations"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "rfc8785>=0.1.4,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
ml = [
    "catboost>=1.2.8,<2",
    "openpyxl>=3.1.5,<4",
    "pandas>=2.2,<4",
    "scikit-learn>=1.7,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
